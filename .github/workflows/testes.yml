name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: ubuntu-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (erro de verdade, não estilo)
        run: python -m pip install ruff && python -m ruff check .
      - name: Testes
        run: python -m unittest discover -s testes
      - name: Exemplo de ponta a ponta
        shell: bash
        run: |
          set -e
          S="$RUNNER_TEMP/compras"
          cp -r exemplos/compras "$S"
          python senku.py validar "$S/carta.json"
          python senku.py documentar "$S/carta.json"
          python senku.py aprovar "$S/carta.json" --por CI
          python senku.py situacao "$S/carta.json"
